substitutions:
  device_name: ctc-gsi-612
  friendly_name: "CTC GSi 612"
  modbus_address: "0x1"

esphome:
  name: ${device_name}
  comment: "CTC GSi 612 Heat Pump Controller"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    modbus_controller: WARN
    modbus: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # Disable power saving for reliability

  # Enable fallback hotspot
  ap:
    ssid: "${friendly_name} Hotspot"
    password: !secret ap_password

captive_portal:

# Web server for diagnostics
web_server:
  port: 80

# ==================== MODBUS CONFIGURATION ====================
# Based on proven kasper-73 configuration and CTC modbus parameter list.pdf
# NO PARITY - matching original working configuration

uart:
  id: mod_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1
  # NO PARITY SPECIFIED - matching kasper-73 working config

modbus:
  id: modbus1
  flow_control_pin: GPIO5
  send_wait_time: 200ms

modbus_controller:
  - id: ctc_gsi
    address: ${modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 10s

# ==================== TEMPERATURE SENSORS ====================
# Using VERIFIED registers from kasper-73 and CTC modbus parameter list.pdf
# All temperatures use S_WORD (signed 16-bit) with factor 0.1°C

sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  # Outdoor temperature - Register 606 (0x025E) - VERIFIED
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Outdoor Temperature"
    id: outdoor_temp
    address: 606
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # DHW (Hot Water) Temperature - Register 600 (0x0258) - VERIFIED
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} DHW Temperature"
