  # Compressor Running - Register 650 bit 0 from PDF - VERIFIED kasper-73
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Running"
    id: compressor_running
    register_type: read
    address: 650
    bitmask: 0x1
    device_class: running

  # Brine Pump Running - Register 650 bit 3 - VERIFIED kasper-73 (0x028A bitmask 0x30)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
