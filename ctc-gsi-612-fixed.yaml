  # ==================== ALARM SENSORS ====================
  # Pump Overload - Register 656 bit 3 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Pump Overload"
    register_type: read
    address: 656
    bitmask: 0x8
    device_class: problem

  # System Pump Overload - Register 656 bit 4 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
