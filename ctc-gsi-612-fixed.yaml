  # Combined Total Operating Hours
  - platform: template
    name: "${friendly_name} Total Operating Hours"
    id: total_hours
    unit_of_measurement: "h"
    state_class: total_increasing
    device_class: duration
    accuracy_decimals: 0
    icon: "mdi:clock-outline"
    lambda: |-
      return (id(total_hours_high).state * 1000.0) + id(total_hours_low).state;
    update_interval: 60s

  # Compressor Operating Hours (High Part) - Register 663 (×1000) from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Hours High"
