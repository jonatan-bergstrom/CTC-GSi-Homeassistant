  # Immersion Heater Status (multiple bits from register 620)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Immersion Heater Low L1"
    register_type: read
    address: 620
    bitmask: 0x80
    device_class: heat

  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Immersion Heater High L1"
    register_type: read
    address: 620
    bitmask: 0x100
    device_class: heat

  # Hardware Input Sensors - Register 617 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Security Thermostat"
    register_type: read
    address: 617
    bitmask: 0x2
