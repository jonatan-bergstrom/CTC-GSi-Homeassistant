    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Active"
    id: alarm_active
    register_type: read
    address: 550
    bitmask: 0x1
    device_class: problem

  # High Current - Register 550 bit 1 from PDF
  - platform: modbus_controller
