    value_type: S_WORD
    unit_of_measurement: "min"
    state_class: measurement
    icon: "mdi:timer-sand"

  # Total Operating Hours (High Part) - Register 291 (×1000) from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Total Hours High"
    id: total_hours_high
    address: 291
    register_type: read
    value_type: U_WORD
    internal: true

  # Total Operating Hours (Low Part) - Register 290 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Total Hours Low"
    id: total_hours_low
    address: 290
    register_type: read
    value_type: U_WORD
