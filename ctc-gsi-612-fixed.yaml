  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Radiator Pump 1"
    register_type: read
    address: 620
    bitmask: 0x1
    device_class: running

  # DHW Valve - Register 620 bit 6 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} DHW Valve"
    register_type: read
    address: 620
    bitmask: 0x40
