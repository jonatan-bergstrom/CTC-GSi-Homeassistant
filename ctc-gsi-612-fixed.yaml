  # Low Brine Flow - Register 656 bit 12 from PDF
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Low Brine Flow"
    register_type: read
    address: 656
    bitmask: 0x1000
