# ==================== TEXT SENSORS ====================
text_sensor:
  # Work Mode Status - Register 571
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Work Mode"
    id: work_mode
    register_type: read
    address: 571
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch(value) {
        case 0: return std::string("HP Upper Tank");
        case 1: return std::string("HP Lower Tank");
        case 2: return std::string("Add Heat");
        case 3: return std::string("HP + Add Heat");
        default: return std::string("Unknown");
      }
    icon: "mdi:state-machine"

  # System Status Text
  - platform: template
    name: "${friendly_name} System Status"
    id: system_status
    icon: "mdi:information-outline"
    lambda: |-
      if (id(alarm_active).state) {
        return {"Alarm Active"};
      } else if (id(compressor_running).state) {
        return {"Running"};
      } else if (id(shut_off).state) {
        return {"Shut Off"};
      } else {
        return {"Idle"};
      }
    update_interval: 5s

# ==================== DIAGNOSTIC SENSORS ====================
# These help monitor ESPHome/Modbus health

  - platform: template
    name: "${friendly_name} Compressor COP"
    id: compressor_cop
    icon: "mdi:chart-arc"
    unit_of_measurement: ""
    accuracy_decimals: 2
    lambda: |-
      // COP = Heat Output / Electrical Input
      // Rough calculation based on temperature difference
      float t_out = id(hp_flow_out_temp).state;
      float t_in = id(brine_in_temp).state;
      if (t_out > 0 && t_in > 0 && (t_out - t_in) > 0) {
        // Simplified Carnot efficiency
        float cop = (t_out + 273.15) / (t_out - t_in);
        return cop * 0.5; // Realistic efficiency factor
      }
      return 0.0;
    update_interval: 60s

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} WiFi SSID"

