    filters:
      - multiply: 0.1

  # Room Sensor 1 Temperature - Register 609
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Room 1 Temperature"
    id: room1_temp
    address: 609
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Room Sensor 2 Temperature - Register 610
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Room 2 Temperature"
    id: room2_temp
    address: 610
    register_type: read
