      - multiply: 0.1

  # Heat Pump Brine In Temperature - Register 631
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Brine In Temperature"
    id: brine_in_temp
    address: 631
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Heat Pump Flow In Temperature - Register 632
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} HP Flow In Temperature"
    id: hp_flow_in_temp
    address: 632
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Heat Pump Flow Out Temperature - Register 634
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} HP Flow Out Temperature"
    id: hp_flow_out_temp
    address: 634
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Discharge Temperature - Register 635
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Discharge Temperature"
    id: discharge_temp
    address: 635
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Suction Gas Temperature - Register 636
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Suction Gas Temperature"
    id: suction_gas_temp
    address: 636
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Calculated Condensing Temperature - Register 639
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Condensing Temperature"
    id: condensing_temp
    address: 639
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Calculated Evaporating Temperature - Register 640
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Evaporating Temperature"
    id: evaporating_temp
    address: 640
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # ==================== PRESSURE SENSORS ====================
  # High Pressure - Register 637 (0.1 Bar)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} High Pressure"
    id: high_pressure
    address: 637
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Low Pressure - Register 638 (0.1 Bar)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Low Pressure"
    id: low_pressure
    address: 638
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # ==================== PUMP & VALVE STATUS ====================
  # Charge Pump Value - Register 648 (0.1%)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Charge Pump"
    id: charge_pump
    address: 648
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Expansion Valve Position - Register 642 (0.1%)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Expansion Valve Position"
    id: expansion_valve
    address: 642
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Superheat - Register 641 (0.1°C)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Superheat"
    id: superheat
    address: 641
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # ==================== POWER & CURRENT ====================
  # Heat Quantity Counter Capacity - Register 644 (0.1 kW)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Heat Capacity"
    id: heat_capacity
    address: 644
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Soft Start Current - Register 645 (0.1 A)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Soft Start Current"
    id: soft_start_current
    address: 645
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Current L1 - Register 612 (0.1A)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Current L1"
    id: current_l1
    address: 612
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Current L2 - Register 613 (0.1A)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Current L2"
    id: current_l2
    address: 613
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Current L3 - Register 614 (0.1A)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Current L3"
    id: current_l3
    address: 614
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # ==================== RUNTIME STATISTICS ====================
  # Compressor Start Delay Timer - Register 647 (minutes)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Start Delay"
    id: comp_start_delay
    address: 647
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "min"
    state_class: measurement
    icon: "mdi:timer-sand"

  # Total Operating Hours (High Part) - Register 291 (×1000)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Total Hours High"
    id: total_hours_high
    address: 291
    register_type: read
    value_type: U_WORD
    internal: true

  # Total Operating Hours (Low Part) - Register 290
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Total Hours Low"
    id: total_hours_low
    address: 290
    register_type: read
    value_type: U_WORD
    internal: true

  # Combined Total Operating Hours
  - platform: template
    name: "${friendly_name} Total Operating Hours"
    id: total_hours
    unit_of_measurement: "h"
    state_class: total_increasing
    device_class: duration
    accuracy_decimals: 0
    icon: "mdi:clock-outline"
    lambda: |-
      return (id(total_hours_high).state * 1000.0) + id(total_hours_low).state;
    update_interval: 60s

  # Compressor Operating Hours (High Part) - Register 663 (×1000)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Hours High"
    id: comp_hours_high
    address: 663
    register_type: read
    value_type: U_WORD
    internal: true

  # Compressor Operating Hours (Low Part) - Register 664
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Hours Low"
    id: comp_hours_low
    address: 664
    register_type: read
    value_type: U_WORD
    internal: true

  # Combined Compressor Operating Hours
  - platform: template
    name: "${friendly_name} Compressor Operating Hours"
    id: comp_hours
    unit_of_measurement: "h"
    state_class: total_increasing
    device_class: duration
    accuracy_decimals: 0
    icon: "mdi:engine"
    lambda: |-
      return (id(comp_hours_high).state * 1000.0) + id(comp_hours_low).state;
    update_interval: 60s

  # Compressor Operating Time per 24h - Register 665 (minutes)
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Runtime 24h"
    id: comp_runtime_24h
    address: 665
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "min"
    state_class: measurement
    icon: "mdi:timer"

  # Compressor Starts per 24h - Register 666
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Starts 24h"
    id: comp_starts_24h
    address: 666
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "starts"
    state_class: measurement
    icon: "mdi:counter"

  # ==================== SETPOINTS (READ VALUES) ====================
  # Heating Circuit 1: Primary Flow Setpoint - Register 559
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Primary Flow Setpoint"
    id: primary_flow_setpoint
    address: 559
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Upper Tank Setpoint - Register 564
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Upper Tank Setpoint"
    id: upper_tank_setpoint
    address: 564
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Lower Tank Setpoint - Register 563
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Lower Tank Setpoint"
    id: lower_tank_setpoint
    address: 563
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Program Version Month/Day - Register 691
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Software Version Date"
    id: sw_version_date
    address: 691
    register_type: read
    value_type: U_WORD
    state_class: measurement

  # Program Version Year - Register 692
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Software Version Year"
    id: sw_version_year
    address: 692
    register_type: read
    value_type: U_WORD
    state_class: measurement

# ==================== BINARY SENSORS (STATUS BITS) ====================
binary_sensor:
  # Alarm Active - Register 550 bit 0
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Active"
    id: alarm_active
    register_type: read
    address: 550
    bitmask: 0x1  # Bit 0
    device_class: problem

  # High Current Consumption - Register 550 bit 1
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} High Current"
    id: high_current
    register_type: read
    address: 550
    bitmask: 0x2  # Bit 1
    device_class: problem

  # Shut Off - Register 550 bit 3
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Shut Off"
    id: shut_off
    register_type: read
    address: 550
    bitmask: 0x8  # Bit 3

  # Extra DHW - Register 550 bit 4
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Extra DHW Active"
    id: extra_dhw_active
    register_type: read
    address: 550
    bitmask: 0x10  # Bit 4

  # Heating Circuit 1: Heating On - Register 550 bit 5
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Heating On"
    id: heating_on
    register_type: read
    address: 550
    bitmask: 0x20  # Bit 5
    device_class: heat

  # Lower Tank: Heat Pump - Register 550 bit 8
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Lower Tank HP"
    id: lower_tank_hp
    register_type: read
    address: 550
    bitmask: 0x100  # Bit 8
    device_class: running

  # Upper Tank: Heat Pump - Register 550 bit 9
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Upper Tank HP"
    id: upper_tank_hp
    register_type: read
    address: 550
    bitmask: 0x200  # Bit 9
    device_class: running

  # Tariff: Immersion Heater Blocked - Register 550 bit 10
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Tariff Immersion Blocked"
    id: tariff_immersion_blocked
    register_type: read
    address: 550
    bitmask: 0x400  # Bit 10

  # Tariff: Heat Pump Blocked - Register 550 bit 11
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Tariff HP Blocked"
    id: tariff_hp_blocked
    register_type: read
    address: 550
    bitmask: 0x800  # Bit 11

  # Compressor On/Off - Register 650 bit 0
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Compressor Running"
    id: compressor_running
    register_type: read
    address: 650
    bitmask: 0x1  # Bit 0
    device_class: running

  # Brine Pump On/Off - Register 650 bit 3
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Brine Pump Running"
    id: brine_pump_running
    register_type: read
    address: 650
    bitmask: 0x8  # Bit 3
    device_class: running

  # ==================== ALARM SENSORS ====================
  # Alarm Register 1 - Register 656
  # Pump Overload - bit 3
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Pump Overload"
    register_type: read
    address: 656
    bitmask: 0x8  # Bit 3
    device_class: problem

  # System Pump Overload - bit 4
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm System Pump Overload"
    register_type: read
    address: 656
    bitmask: 0x10  # Bit 4
    device_class: problem

  # Compressor Overload - bit 5
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Compressor Overload"
    register_type: read
    address: 656
    bitmask: 0x20  # Bit 5
    device_class: problem

  # High Pressure Alarm - bit 7
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm High Pressure"
    register_type: read
    address: 656
    bitmask: 0x80  # Bit 7
    device_class: problem

  # Low Brine Flow - bit 12
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Low Brine Flow"
    register_type: read
    address: 656
    bitmask: 0x1000  # Bit 12
    device_class: problem

  # Low Brine Temperature - bit 13
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Alarm Low Brine Temp"
    register_type: read
    address: 656
    bitmask: 0x2000  # Bit 13
    device_class: problem

  # ==================== OUTPUT RELAYS ====================
  # Radiator Pump 1 - Register 620 bit 0
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Radiator Pump 1"
    register_type: read
    address: 620
    bitmask: 0x1
    device_class: running

  # DHW Valve - Register 620 bit 6
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} DHW Valve"
    register_type: read
    address: 620
    bitmask: 0x40
    device_class: opening

  # Immersion Heater Low L1 - Register 620 bit 7
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Immersion Heater Low L1"
    register_type: read
    address: 620
    bitmask: 0x80
    device_class: heat

  # Immersion Heater High L1 - Register 620 bit 8
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Immersion Heater High L1"
    register_type: read
    address: 620
    bitmask: 0x100
    device_class: heat

  # Immersion Heater Low L2 - Register 620 bit 9
  - platform: modbus_controller
    modbus_controller_id: ctc_gsi
    name: "${friendly_name} Immersion Heater Low L2"
    register_type: read
    address: 620
    bitmask: 0x200
    device_class: heat

